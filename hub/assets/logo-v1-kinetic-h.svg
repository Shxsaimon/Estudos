<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgV1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181524" />
      <stop offset="50%" stop-color="#121019" />
      <stop offset="100%" stop-color="#0B0910" />
    </linearGradient>

    <linearGradient id="borderV1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8129D9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6F00FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D253D" stop-opacity="0.2" />
    </linearGradient>

    <!-- Main H Gradient: Electric Violet -> Vivid Purple -> Orchid Magenta -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#6F00FF" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlowV1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6F00FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#14121A" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadowV1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6F00FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgV1)" stroke="url(#borderV1)" stroke-width="2.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlowV1)" />

  <!-- 4 Tracks Constellation Accent Dots -->
  <circle cx="72" cy="72" r="5" fill="#F7DF1E" opacity="0.9" /> <!-- JavaScript -->
  <circle cx="440" cy="72" r="5" fill="#8892BF" opacity="0.9" /> <!-- PHP -->
  <circle cx="72" cy="440" r="5" fill="#10B981" opacity="0.9" /> <!-- Visualg -->
  <circle cx="440" cy="440" r="5" fill="#06B6D4" opacity="0.9" /> <!-- Webstudio -->

  <!-- Monogram Glyph -->
  <g filter="url(#shadowV1)">
    <!-- LEFT PILLAR: Sleek vertical with chamfered inner bracket apex -->
    <path d="M 148 132
             C 148 118, 160 110, 174 110
             L 204 110
             C 214 110, 222 116, 224 126
             L 224 196
             L 186 256
             L 224 316
             L 224 386
             C 222 396, 214 402, 204 402
             L 174 402
             C 160 402, 148 394, 148 380
             Z"
          fill="url(#hGrad)" />

    <!-- RIGHT PILLAR: Mirror of Left Pillar -->
    <path d="M 364 132
             C 364 118, 352 110, 338 110
             L 308 110
             C 298 110, 290 116, 288 126
             L 288 196
             L 326 256
             L 288 316
             L 288 386
             C 290 396, 298 402, 308 402
             L 338 402
             C 352 402, 364 394, 364 380
             Z"
          fill="url(#hGrad)" />

    <!-- CENTRAL CROSSBAR -->
    <path d="M 186 242
             L 326 242
             C 334 242, 340 248, 340 256
             C 340 264, 334 270, 326 270
             L 186 270
             C 178 270, 172 264, 172 256
             C 172 248, 178 242, 186 242
             Z"
          fill="url(#hGrad)" />

    <!-- INNER GLOWING CODE BRACKETS (< >) STROKES IN WHITE & VIOLET -->
    <path d="M 218 190 L 176 256 L 218 322"
          stroke="#FFFFFF"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <path d="M 294 190 L 336 256 L 294 322"
          stroke="#FFFFFF"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <!-- CENTRAL DIAMOND HUB APERTURE -->
    <polygon points="256,226 286,256 256,286 226,256" fill="#121019" stroke="#A855F7" stroke-width="4" />
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
  </g>
</svg>