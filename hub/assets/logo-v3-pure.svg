<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171422" />
      <stop offset="100%" stop-color="#0B0911" />
    </linearGradient>
    <linearGradient id="borderV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8129D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6F00FF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Electric Violet to Orchid -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6F00FF" />
      <stop offset="100%" stop-color="#5800CC" />
    </linearGradient>

    <linearGradient id="bridgeGradV3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F00FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6F00FF" />
    </linearGradient>
    
    <radialGradient id="glowV3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6F00FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14121A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgV3)" stroke="url(#borderV3)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="160" fill="url(#glowV3)" />

  <!-- 4 Track Dots -->
  <circle cx="72" cy="72" r="5" fill="#F7DF1E" />
  <circle cx="440" cy="72" r="5" fill="#8892BF" />
  <circle cx="72" cy="440" r="5" fill="#10B981" />
  <circle cx="440" cy="440" r="5" fill="#06B6D4" />

  <g id="pure-kinetic-h">
    <!-- Left Stalk: Thick vertical with subtle chamfered code notch -->
    <rect x="136" y="112" width="60" height="288" rx="24" fill="url(#pillarGrad)" />
    
    <!-- Right Stalk -->
    <rect x="316" y="112" width="60" height="288" rx="24" fill="url(#pillarGrad)" />

    <!-- Connecting Bridge -->
    <rect x="180" y="232" width="152" height="48" rx="16" fill="url(#bridgeGradV3)" />

    <!-- Central Diamond Nexus Aperture -->
    <polygon points="256,204 296,256 256,308 216,256" fill="#171422" stroke="#FFFFFF" stroke-width="6" />
    <polygon points="256,216 284,256 256,296 228,256" fill="url(#pillarGrad)" />
    
    <!-- Center White Spark -->
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />

    <!-- Sleek Inward Code Accents: < and > micro-glyphs on the stalks -->
    <path d="M 176 224 L 152 256 L 176 288" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 336 224 L 360 256 L 336 288" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>