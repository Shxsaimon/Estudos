<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181524" />
      <stop offset="100%" stop-color="#0C0A12" />
    </linearGradient>
    <linearGradient id="borderV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8129D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6F00FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradient Left Chevron -->
    <linearGradient id="chevLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6F00FF" />
    </linearGradient>

    <!-- Gradient Right Chevron -->
    <linearGradient id="chevRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F00FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <radialGradient id="glowV2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6F00FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#14121A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgV2)" stroke="url(#borderV2)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="170" fill="url(#glowV2)" />

  <g id="glyph-v2">
    <!-- LEFT CHEVRON (<) -->
    <path d="M 204 136
             L 124 256
             L 204 376"
          stroke="url(#chevLeft)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <!-- RIGHT CHEVRON (>) -->
    <path d="M 308 136
             L 388 256
             L 308 376"
          stroke="url(#chevRight)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <!-- CONNECTING BRIDGE (Forms the H) -->
    <path d="M 164 256 L 348 256"
          stroke="url(#chevLeft)"
          stroke-width="32"
          stroke-linecap="round" />

    <!-- CODE SLASH ( / ) IN CRISP WHITE -->
    <path d="M 284 176 L 228 336"
          stroke="#FFFFFF"
          stroke-width="20"
          stroke-linecap="round" />

    <!-- CENTRAL NEXUS CORE (Glowing Node on the slash) -->
    <circle cx="256" cy="256" r="16" fill="#121019" stroke="#A855F7" stroke-width="5" />
    <circle cx="256" cy="256" r="7" fill="#FFFFFF" />
  </g>
</svg>